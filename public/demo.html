<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Widget demo site</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 60px auto; padding: 0 20px; color: #27272a; }
        code { background: #f4f4f5; padding: 2px 6px; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Demo customer website</h1>
    <p>Open this page as <code>/demo.html?key=YOUR_WIDGET_PUBLIC_KEY</code>. The chat bubble appears bottom-right.</p>
    <p>Widget language: <a href="?" id="lang-az">AZ</a> · <a href="?" id="lang-en">EN</a> · <a href="?" id="lang-ru">RU</a> (default: your browser language)</p>
    <p id="status"></p>
    <script>
        const params = new URLSearchParams(location.search);
        const key = params.get('key');
        for (const lang of ['az', 'en', 'ru']) {
            document.getElementById('lang-' + lang).href = '?' + new URLSearchParams({ key: key || '', lang });
        }
        if (!key) {
            document.getElementById('status').textContent = 'Missing ?key= parameter.';
        } else {
            const s = document.createElement('script');
            s.src = '/widget/loader.js';
            s.dataset.key = key;
            if (params.get('lang')) s.dataset.lang = params.get('lang');
            s.async = true;
            document.body.appendChild(s);
        }
    </script>
</body>
</html>
